[package]
name = "qevm-evm"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Real Groth16 receipts, an on-EVM verifier and gas metering for Q-EVM"

[dependencies]
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
rand_chacha = "0.3"
revm = { version = "14", default-features = false, features = ["std"] }
serde = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
qevm-crypto = { path = "../crypto" }
